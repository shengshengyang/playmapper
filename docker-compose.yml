# Docker Compose - 精簡版（不包含 PostgreSQL，使用外部資料庫）
# 使用方式: docker-compose up -d
# 需先設定環境變數或建立 .env 檔案

services:
  # Spring Boot 後端
  backend:
    build:
      context: ./family-map-backend
      dockerfile: Dockerfile
    container_name: family-map-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${DATABASE_URL:-jdbc:postgresql://host.docker.internal:5432/family_map}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-your-256-bit-secret-key-please-change-in-production-environment}
      JAVA_OPTS: -Xms256m -Xmx512m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    networks:
      - family-map-network

  # Vue 3 前端（使用者端）
  frontend:
    build:
      context: ./family-map-frontend
      dockerfile: Dockerfile
    container_name: family-map-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - family-map-network

  # Vue 3 管理後台
  admin:
    build:
      context: ./family-map-admin
      dockerfile: Dockerfile
    container_name: family-map-admin
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - family-map-network

networks:
  family-map-network:
    driver: bridge
